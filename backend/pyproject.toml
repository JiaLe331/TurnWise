[project]
name = "turnwise-backend"
version = "0.1.0"
description = "TurnWise API, gateway, and observation worker scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]
vision = [
    "inference-models>=0.39.3",
    "opencv-python-headless>=5.0.0.93",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
